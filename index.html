<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Campeonato de Fútbol</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>⚽ Tabla de Posiciones del Campeonato</h1>
    </header>

    <main>
        <section id="ingreso-resultados">
            <h2>Ingresar Resultado del Partido</h2>
            <form id="form-resultado">
                <div class="input-group">
                    <label for="equipo1">Equipo Local:</label>
                    <select id="equipo1" required></select>
                    <input type="number" id="goles1" placeholder="Goles" min="0" required>
                </div>

                <div class="input-group">
                    <label for="equipo2">Equipo Visitante:</label>
                    <select id="equipo2" required></select>
                    <input type="number" id="goles2" placeholder="Goles" min="0" required>
                </div>

                <button type="submit">Registrar Resultado</button>
            </form>
        </section>

        <section id="tabla-posiciones">
            <h2>Grupo A - Tabla Actualizada</h2>
            <table id="tabla-grupo-a">
                <thead>
                    <tr>
                        <th>Equipo</th>
                        <th>Ptos</th>
                        <th>PJ</th>
                        <th>PG</th>
                        <th>PE</th>
                        <th>PP</th>
                        <th>GF</th>
                        <th>GC</th>
                        <th>DG</th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
